name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name doodle_jump
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ipa --no-codesign
      - name: List build output
        run: |
          find build/ios -maxdepth 4 -mindepth 1 | head -60
          find build -name "*.ipa" -o -name "*.xcarchive" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: doodle-jump-ipa
          if-no-files-found: warn
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/**
